
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to Earn Your Badge</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:flex;justify-content:center;align-items:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#101827,#263c58);
 color:white;text-align:center
}
.card{
 width:100%;max-width:580px;padding:30px 22px;
 background:#ffffff12;border:1px solid #ffffff30;
 border-radius:22px;box-shadow:0 15px 40px #0005
}
h1{color:#ffd166;font-size:29px}
p{color:#d5deeb;line-height:1.6}
button{
 padding:13px 23px;border:0;border-radius:30px;
 background:#ffd166;color:#172235;font-weight:bold;
 font-size:16px;cursor:pointer;margin:8px
}
button:hover{transform:scale(1.04)}
.option{
 display:block;width:100%;margin:12px 0;padding:15px;
 border:1px solid #ffffff50;border-radius:12px;
 background:#ffffff12;color:white;text-align:left;
 font-size:15px
}
.option:disabled{cursor:default;opacity:1}
.correct{background:#176b45!important;border-color:#55e6a0!important}
.wrong{background:#8b3030!important;border-color:#ff8888!important}
#feedback{min-height:55px;font-weight:bold}
#progress{color:#ffd166}
.badge{
 font-size:75px;margin:20px auto;
 animation:pop .7s ease
}
@keyframes pop{
 0%{transform:scale(.2);opacity:0}
 75%{transform:scale(1.2)}
 100%{transform:scale(1);opacity:1}
}
.gold{color:#ffd166;text-shadow:0 0 25px #ffd166}
.silver{color:#dce5f0;text-shadow:0 0 20px #dce5f0}
.bronze{color:#d99a65;text-shadow:0 0 20px #d99a65}
.shake{animation:shake .35s}
@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translateX(-7px)}
 75%{transform:translateX(7px)}
}
.hidden{display:none}
</style>
</head>
<body>
<div class="card" id="welcome">
 <h1>🏆 Scan to Earn Your Badge</h1>
 <p>Welcome, Tech Explorer!</p>
 <p>Ready to test your technology knowledge?</p>
 <p>Answer 3 random questions and unlock your achievement badge.</p>
 <p>🥉 Bronze &nbsp; 🥈 Silver &nbsp; 🥇 Gold</p>
 <button onclick="startQuiz()">Start Challenge 🚀</button>
</div>

<div class="card hidden" id="quiz">
 <p id="progress">Question 1 of 3</p>
 <h2 id="question"></h2>
 <div id="options"></div>
 <p id="feedback"></p>
 <button id="nextBtn" class="hidden" onclick="nextQuestion()">Next Question →</button>
</div>

<div class="card hidden" id="result">
 <h1 id="resultTitle">Challenge Complete!</h1>
 <div class="badge" id="badge"></div>
 <h2 id="badgeName"></h2>
 <p id="score"></p>
 <p id="message"></p>
 <button onclick="startQuiz()">Play Again 🔄</button>
 <br>
 <button onclick="visitPortfolio()">Visit My Portfolio 🌐</button>
</div>

let selectedQuestions = [];
let current = 0;
let points = 0;
let answered = false;

function startQuiz(){
 selectedQuestions = [...questions].sort(()=>Math.random()-0.5).slice(0,3);
 current = 0;
 points = 0;
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 answered = false;
 const item = selectedQuestions[current];
 document.getElementById("progress").textContent = `Question ${current+1} of 3`;
 document.getElementById("question").textContent = item.q;
 document.getElementById("feedback").textContent = "";
 document.getElementById("nextBtn").classList.add("hidden");
 const area = document.getElementById("options");
 area.innerHTML = "";

 item.o.forEach((choice,index)=>{
  const btn = document.createElement("button");
  btn.className = "option";
  btn.textContent = String.fromCharCode(65+index)+". "+choice;
  btn.onclick = ()=>checkAnswer(index,btn);
  area.appendChild(btn);
 });
}

function checkAnswer(index,button){
 if(answered) return;
 answered = true;
 const item = selectedQuestions[current];
 const all = document.querySelectorAll(".option");
 all.forEach(btn=>btn.disabled=true);

 if(index===item.a){
  points++;
  button.classList.add("correct");
  document.getElementById("feedback").textContent = "✨ Correct answer! Well done!";
 }else{
  button.classList.add("wrong");
  all[item.a].classList.add("correct");
  document.getElementById("quiz").classList.add("shake");
  setTimeout(()=>document.getElementById("quiz").classList.remove("shake"),400);
  document.getElementById("feedback").textContent =
   "Not quite! 💡 Hint: "+item.h;
 }
 document.getElementById("nextBtn").textContent =
  current===2 ? "See My Result 🏆" : "Next Question →";
 document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
 current++;
 if(current<3){
  showQuestion();
 }else{
  showResult();
 }
}

function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 let name, symbol, style, message;
 if(points===3){
  name="Gold Tech Explorer";
  symbol="🥇";
  style="gold";
  message="Amazing! You mastered all 3 questions!";
 }else if(points===2){
  name="Silver Tech Explorer";
  symbol="🥈";
  style="silver";
  message="Great work! You're building strong tech knowledge.";
 }else if(points===1){
  name="Bronze Tech Explorer";
  symbol="🥉";
  style="bronze";
  message="Good start! Keep learning and growing.";
 }else{
  name="Keep Exploring!";
  symbol="💪";
  style="";
  message="Better luck next time! Every attempt is a chance to learn.";
 }

 document.getElementById("badge").textContent=symbol;
 document.getElementById("badge").className="badge "+style;
 document.getElementById("badgeName").textContent=name;
 document.getElementById("score").textContent=`Your Score: ${points} / 3`;
 document.getElementById("message").textContent=message;
 document.getElementById("resultTitle").textContent=
  points===0 ? "Challenge Complete!" : "Congratulations!";
}

function visitPortfolio(){
 if(PORTFOLIO_URL==="PASTE_YOUR_PORTFOLIO_URL_HERE"){
  alert("Your portfolio link will be added before publishing!");
  return;
 }
 window.open(PORTFOLIO_URL,"_blank");
}
</script>
</body>
</html>
